services:
  beszel:
    image: henrygd/beszel:latest
    container_name: ${CONTAINER_NAME}_main
    labels:
      - autoheal-app=true
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 8090:8090
    volumes:
      - ./beszel_socket:/beszel_socket:z
      - ./${CONTAINER_NAME}_data/config:/beszel_data:z
  beszel-docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: ${CONTAINER_NAME}_docker_socket_proxy
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    network_mode: bridge
    read_only: true
    tmpfs:
      - /run
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      TZ: ${TZ:-Europe/Moscow}
      CONTAINERS: "1"
      ALLOW_LOGS: "1"
      POST: "0"
      EVENTS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
  beszel-agent:
    image: henrygd/beszel-agent-intel
    container_name: ${CONTAINER_NAME}_lockal_agent
    labels:
      - autoheal-app=true
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_socket:/beszel_socket:z
      - ./${CONTAINER_NAME}_data/agent:/var/lib/beszel-agent:Z
    environment:
      TZ: ${TZ:-Europe/Moscow}
      LISTEN: ${LISTEN}
      KEY: ${KEY}
      TOKEN: ${TOKEN}
      HUB_URL: ${HUB_URL}
      SMART_DEVICES: /dev/ht_1,/dev/ht_2,/dev/sh_1,/dev/sh_2,/dev/nvme,/dev/ssd
      DOCKER_HOST: tcp://127.0.0.1:2375
    depends_on:
      - beszel-docker-socket-proxy
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
      - CAP_PERFMON
    devices:
      - /dev/disk/by-id/ata-Hitachi_HTS547575A9E384_J2140059CYT8EA:/dev/ht_1
      - /dev/disk/by-id/ata-Hitachi_HTS547575A9E384_J2340059DG0AXA:/dev/ht_2
      - /dev/disk/by-id/ata-ST9750420AS_6WS1Z4D0:/dev/sh_1
      - /dev/disk/by-id/ata-ST9750420AS_6WS1ZZHS:/dev/sh_2
      - /dev/disk/by-id/nvme-KBG30ZMV256G_TOSHIBA_78NPC02QP12P:/dev/nvme
      - /dev/disk/by-id/ata-DGSR2001TP13T_55BD07571D4500611142:/dev/ssd
      # GPU monitoring
      - /dev/dri:/dev/dri
      # ZFS monitoring
      - /dev/zfs:/dev/zfs
  #
  # BeckUps
  #
  ## main
  backup_restic__beszel:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: backup
    volumes:
      - ./${CONTAINER_NAME}_data/config:/backup_data:ro,z
  ## prune
  prune_restic__beszel:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: prune
  ## chekc
  check_restic__beszel:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: check
#
# NetWorks
#
networks:
  apprise_notification:
    external: true

# Эти параметры читает setup.sh из результата docker compose config.
x-xray-setup:
  container_name: ${CONTAINER_NAME:?Set CONTAINER_NAME in .env}
  domain: ${DOMAIN:?Set DOMAIN in .env}
services:
  app:
    image: ghcr.io/xtls/xray-core:latest
    container_name: ${CONTAINER_NAME}_main
    restart: unless-stopped
    command: ["run", "-c", "/etc/xray/config.json"]
    expose:
      - "8080"
    networks:
      - traefik
    volumes:
      - type: bind
        source: ./${CONTAINER_NAME}_data/config/config.json
        target: /etc/xray/config.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      # Watchtower
      com.centurylinklabs.watchtower.enable: "true"
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      ## HTTPS router
      traefik.http.routers.xray.rule: "Host(`xray.${DOMAIN}`) && PathPrefix(`/api/`)"
      traefik.http.routers.xray.priority: "100"
      traefik.http.routers.xray.entrypoints: "websecure"
      traefik.http.routers.xray.tls: "true"
      traefik.http.routers.xray.tls.certresolver: "letsencrypt"
      traefik.http.routers.xray.service: "xray"
      ## HTTPS сервисы
      traefik.http.services.xray.loadbalancer.server.port: "8080"
      traefik.http.services.xray.loadbalancer.server.scheme: "h2c"
      traefik.http.services.xray.loadbalancer.responseforwarding.flushinterval: "-1ms"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  site:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine
    container_name: ${CONTAINER_NAME}_site
    restart: unless-stopped
    # Не запускаем entrypoint-скрипты, изменяющие read-only конфигурацию.
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    expose:
      - "8080"
    networks:
      - traefik
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./site
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.xray-site.rule: "Host(`xray.${DOMAIN}`)"
      traefik.http.routers.xray-site.priority: "10"
      traefik.http.routers.xray-site.entrypoints: "websecure"
      traefik.http.routers.xray-site.tls: "true"
      traefik.http.routers.xray-site.tls.certresolver: "letsencrypt"
      traefik.http.routers.xray-site.service: "xray-site"
      traefik.http.services.xray-site.loadbalancer.server.port: "8080"
      traefik.http.services.xray-site.loadbalancer.server.scheme: "http"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  #
  # BeckUps
  #
  ## main
  backup_restic__xray:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: backup
    environment:
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env}
    volumes:
      - ./${CONTAINER_NAME}_data:/backup_data:ro,z
  ## prune
  prune_restic__xray:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: prune
    environment:
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env}
  ## chekc
  check_restic__xray:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: check
    environment:
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env}
#
# NetWorks
#
networks:
  traefik:
    external: true
  apprise_notification:
    external: true

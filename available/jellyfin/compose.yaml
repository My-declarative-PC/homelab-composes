services:
  jellyfin:
    runtime: runc
    image: lscr.io/linuxserver/jellyfin:latest
    labels:
      - autoheal-app=true
      - com.centurylinklabs.watchtower.enable=true
    container_name: ${CONTAINER_NAME}_main
    environment:
      TZ: ${TZ:-Europe/Moscow}
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PublishedServerUrl:-0.0.0.0} #optional
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./${CONTAINER_NAME}_data/config:/config:z
      - ./${CONTAINER_NAME}_data/cache:/cache:Z
      # cartoons
      - /media/jellyfin/animated-movies:/data/animated-movies:Z
      - /media/jellyfin/animated-series:/data/animated-series:Z
      - /hdd_data/jellyfin/animated-movies:/hdd_data/animated-movies:Z
      - /hdd_data/jellyfin/animated-series:/hdd_data/animated-series:Z
      # anime
      - /media/jellyfin/anime-movies:/data/anime-movies:Z
      - /media/jellyfin/anime-series:/data/anime-series:Z
      - /hdd_data/jellyfin/anime-movies:/hdd_data/anime-movies:Z
      - /hdd_data/jellyfin/anime-series:/hdd_data/anime-series:Z
      # adults
      - /media/jellyfin/movies:/data/movies:Z
      - /media/jellyfin/series:/data/series:Z
      - /hdd_data/jellyfin/movies:/hdd_data/movies:Z
      - /hdd_data/jellyfin/series:/hdd_data/series:Z
      # music
      - /media/jellyfin/music:/data/music:Z
      - /hdd_data/jellyfin/music:/hdd_data/music:Z
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    network_mode: service:amneziawg_jelly
    healthcheck:
      test: curl --fail http://127.0.0.1:8096/health
      interval: 1m
      timeout: 90s
      retries: 3
    depends_on:
      amneziawg_jelly:
        condition: service_healthy
        restart: true
  explo:
    image: ghcr.io/lumepart/explo:latest
    container_name: ${CONTAINER_NAME}_explo
    labels:
      - autoheal-app=true
      - com.centurylinklabs.watchtower.enable=true
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Moscow}
      WEB_UI: ${WEB_UI:-true}
      WIZARD_COMPLETE: ${WIZARD_COMPLETE:-true}
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
      LISTENBRAINZ_USER: ${LISTENBRAINZ_USER}
      LISTENBRAINZ_USER_TOKEN: ${LISTENBRAINZ_USER_TOKEN}
      EXPLO_SYSTEM: ${EXPLO_SYSTEM:-jellyfin}
      SYSTEM_URL: ${SYSTEM_URL:-http://127.0.0.1:8096}
      SYSTEM_USERNAME: ${SYSTEM_USERNAME}
      API_KEY: ${API_KEY}
      LIBRARY_NAME: ${LIBRARY_NAME:-Music}
      PUBLIC_PLAYLIST: ${PUBLIC_PLAYLIST:-false}
      TRACK_MATCH_SCORE: ${TRACK_MATCH_SCORE:-60}
      USE_SUBDIRECTORY: ${USE_SUBDIRECTORY:-false}
      PATH_TEMPLATE: ${PATH_TEMPLATE}
      DOWNLOAD_SERVICES: ${DOWNLOAD_SERVICES:-youtube}
      TRACK_EXTENSION: ${TRACK_EXTENSION:-mp3}
      EMBED_COVER_ART: ${EMBED_COVER_ART:-false}
      SLEEP: ${SLEEP:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./${CONTAINER_NAME}_data/config/explo:/opt/explo/config:Z
      - /media/jellyfin/music/explo:/data:Z
    restart: unless-stopped
    network_mode: service:amneziawg_jelly
    depends_on:
      amneziawg_jelly:
        condition: service_healthy
        restart: true
  #
  # VPN
  #
  amneziawg_jelly:
    extends:
      file: ../../available/amneziawg/amneziawg-compose-base.yaml
      service: amneziawg-client
    volumes:
      - ./${CONTAINER_NAME}_data/amneziawg:/config:Z
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
      - 7288:7288
  #
  # BeckUps
  #
  ## main
  backup_restic__jellyfin:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: backup
    volumes:
      - ./${CONTAINER_NAME}_data/config:/backup_data:ro,z
  ## prune
  prune_restic__jellyfin:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: prune
  ## chekc
  check_restic__jellyfin:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: check
#
# NetWorks
#
networks:
  apprise_notification:
    external: true

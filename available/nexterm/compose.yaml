services:
  nexterm:
    image: nexterm/aio:latest
    labels:
      - autoheal-app=true
      - com.centurylinklabs.watchtower.enable=true
    container_name: ${CONTAINER_NAME}_main
    ports:
      - "6989:6989"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Europe/Moscow}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ./${CONTAINER_NAME}_data:/app/data

# Эти параметры читает setup.sh из результата docker compose config.
x-xray-setup:
  container_name: ${CONTAINER_NAME:?Set CONTAINER_NAME in .env}
  port: "${XRAY_PORT:-443}"
  target_host: ${TARGET_HOST:-www.bing.com}
  server_ip: "${SERVER_IP:-}"

services:
  app:
    image: ghcr.io/xtls/xray-core:latest
    container_name: ${CONTAINER_NAME}_main
    restart: unless-stopped
    command: ["run", "-c", "/etc/xray/config.json"]
    ports:
      - "${XRAY_PORT:-443}:443/tcp"
    volumes:
      - type: bind
        source: ./${CONTAINER_NAME}_data/config/config.json
        target: /etc/xray/config.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      # REALITY принимает подключения напрямую, без HTTP-маршрутизации
      traefik.enable: "false"
      # Обновления XHTTP/REALITY требуют проверки совместимости клиентов
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Резервное копирование останавливает ${CONTAINER_NAME}_main на время снимка.
  backup_restic__xray:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: backup
    environment:
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env}
    volumes:
      - ./${CONTAINER_NAME}_data:/backup_data:ro,z

  prune_restic__xray:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: prune
    environment:
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env}

  check_restic__xray:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: check
    environment:
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env}

networks:
  apprise_notification:
    external: true

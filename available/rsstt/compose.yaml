services:
  rsstt:
    image: rongronggg9/rss-to-telegram
    labels:
      - com.centurylinklabs.watchtower.enable=true
    container_name: ${CONTAINER_NAME}_main
    restart: unless-stopped
    volumes:
      - ./${CONTAINER_NAME}_data:/app/config:z
    environment:
      TZ: ${TZ:-Europe/Moscow}
      TOKEN: ${TOKEN:-token}
      MANAGER: ${MANAGER:-manager}
    network_mode: service:amneziawg_rsstt
    depends_on:
      amneziawg_rsstt:
        condition: service_healthy
        restart: true
  #
  # VPN
  #
  amneziawg_rsstt:
    extends:
      file: ../../available/amneziawg/amneziawg-compose-base.yaml
      service: amneziawg-client
    volumes:
      - ./${CONTAINER_NAME}_data/amneziawg:/config:Z
  #
  # BeckUps
  #
  ## main
  backup_restic__rsstt:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: backup
    volumes:
      - ./${CONTAINER_NAME}_data:/backup_data:ro,z
    environment:
      BACKUP_CRON: "0 40 3 * * *"
  ## prune
  prune_restic__rsstt:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: prune
  ## chekc
  check_restic__rsstt:
    extends:
      file: ../../available/restic/restic-compose-base.yaml
      service: check
    environment:
      CHECK_CRON: "0 35 5 * * *"
#
# NetWorks
#
networks:
  apprise_notification: 
    external: true

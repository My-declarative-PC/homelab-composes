services:
  qbittorrent:
    runtime: runc
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    container_name: ${CONTAINER_NAME}_main
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Moscow}
      WEBUI_PORT: ${WEBUI_PORT:-8080}
      TORRENTING_PORT: ${TORRENTING_PORT:-6881}
    ports:
      - ${WEBUI_PORT:-8080}:${WEBUI_PORT:-8080}
      - ${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}
      - ${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}/udp
    volumes:
      - ./${CONTAINER_NAME}_data/config:/config:Z
      - /media/tor_downloads:/downloads:z
    restart: unless-stopped
    labels:
      - autoheal-app=true
      # WatchTower
      - com.centurylinklabs.watchtower.enable=true
      # HomePage 
      - homepage.group=Media
      - homepage.name=Qbit Torrent
      - homepage.icon=qbittorrent.svg
      - homepage.href=http://torrent.home
      - homepage.description=Torrent downloader
  qbittorrent_vpn:
    runtime: runc
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: vpn_${CONTAINER_NAME}_main
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Moscow}
      WEBUI_PORT: ${VPN_WEBUI_PORT:-8081}
      TORRENTING_PORT: ${VPN_TORRENTING_PORT:-6882}
    volumes:
      - ./vpn_${CONTAINER_NAME}_data/config:/config:Z
      - /media/tor_downloads:/downloads:z
    restart: unless-stopped
    labels:
      - autoheal-app=true
      # WatchTower
      - com.centurylinklabs.watchtower.enable=true
      # HomePage 
      - homepage.group=Media
      - homepage.name=Qbit Torrent (vpn)
      - homepage.icon=qbittorrent.svg
      - homepage.href=http://torrent.home
      - homepage.description=Torrent downloader over VPN
    network_mode: service:amneziawg_qtor
    depends_on:
      amneziawg_qtor:
        condition: service_healthy
        restart: true
  #
  # VPN
  #
  amneziawg_qtor:
    extends:
      file: ../../available/amneziawg/amneziawg-compose-base.yaml
      service: amneziawg-client
    volumes:
      - ./${CONTAINER_NAME}_data/amneziawg:/config:Z
    ports:
      - ${VPN_WEBUI_PORT:-8081}:${VPN_WEBUI_PORT:-8081}
      - ${VPN_TORRENTING_PORT:-6882}:${VPN_TORRENTING_PORT:-6882}
      - ${VPN_TORRENTING_PORT:-6882}:${VPN_TORRENTING_PORT:-6882}/udp
#
# NetWorks
#
networks: {}
